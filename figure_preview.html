<h1>Main-text figure preview: a scan with many small metastases</h1>
<p>Draft for review, not yet in the paper. Case 1 of the <a href="viewer.html">3D scan viewer</a> (held-out test scan BraTS-MET-00585-000), where you can scroll through the same scan.</p>
<figure><img src="static/many_mets.png" alt="Fourteen small metastases in one test scan; each system's found lesions per row">
<figcaption><b>Fourteen small metastases in one held-out test scan</b> (T1c; chosen by a fixed rule: the scan with ≥10 lesions that r15 reads most completely). Left: mean-intensity projection with every lesion ≥0.1&nbsp;mL outlined and numbered (inferior to superior). Right: each lesion on its centroid slice, one row per system; frame green = found, red = missed at 1 FP per scan; + = candidates the system keeps within two slices.</figcaption></figure>
